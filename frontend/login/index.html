<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in</title>

    <link rel="stylesheet" href="/assets/shared/styles.css">
    <link rel="stylesheet" href="/assets/login/styles.css">
</head>

<body>

<main class="login">
    <div class="login-card">

        <h1>Log in</h1>

        <p class="muted">
            Welcome back. Enter your credentials to continue.
        </p>

        <div id="form-error" class="error-banner" hidden></div>

        <form action="api/auth/login" method="post" id="login-form">

            <label for="email">
                Email
            </label>

            <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
            >

            <label for="password">
                Password
            </label>

            <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    autocomplete="current-password"
            >

            <button type="submit" class="button primary">
                Log in
            </button>

        </form>

    </div>
</main>

<footer>
    <p>© 2026 YourApp</p>
</footer>

<script src="/assets/login/script.js"></script>
</body>
</html>
