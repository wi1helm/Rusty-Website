<!--signup/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create organization</title>

    <link rel="stylesheet" href="/assets/shared/styles.css">
    <link rel="stylesheet" href="/assets/signup/styles.css">
</head>

<body>

<main class="signup">
    <div class="signup-card">

        <h1>Create your organization</h1>

        <p class="muted">
            Set up your organization and create your owner account.
        </p>

        <form action="/api/organizations/signup" method="post">

            <label for="organization-name">
                Organization name
            </label>

            <input
                    id="organization-name"
                    name="name"
                    type="text"
                    required
                    autocomplete="organization"
            >

            <label for="email">
                Email
            </label>

            <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
            >

            <label for="password">
                Password
            </label>

            <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    autocomplete="new-password"
            >

            <label for="password-confirm">
                Confirm password
            </label>

            <input
                    id="password-confirm"
                    name="confirm"
                    type="password"
                    required
                    autocomplete="new-password"
            >

            <button type="submit" class="button primary">
                Create organization
            </button>

        </form>

        <p class="login-link">
            Already have access?
            <a href="/login">Log in</a>
        </p>

    </div>
</main>

<footer>
    <p>© 2026 YourApp</p>
</footer>

</body>
</html>
