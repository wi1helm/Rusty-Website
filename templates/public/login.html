{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/assets/login/styles.css">
{% endblock %}

{% block content %}
<main class="login">
  <div class="login-card">

    <h1>Log in</h1>

    <p class="muted">
      Welcome back. Enter your credentials to continue.
    </p>

    <div id="form-error" class="error-banner" hidden></div>

    <form action="api/auth/login" method="post" id="login-form">

      <label for="email">
        Email
      </label>

      <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
      >

      <button type="submit" class="button primary">
        Log in
      </button>

    </form>

  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="/assets/signup/script.js"></script>
{% endblock %}
