{% extends "base.html" %}

{% block title %}Create organization{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/assets/signup/styles.css">
{% endblock %}

{% block content %}

<main class="signup">
  <div class="signup-card">

    <h1>Create your organization</h1>

    <p class="muted">
      Set up your organization and create your owner account.
    </p>

    <div id="form-error" class="error-banner" hidden></div>

    <form action="/api/organizations/signup" method="post" id="signup-form">

      <label for="organization-name">
        Organization name
      </label>

      <input
              id="organization-name"
              name="name"
              type="text"
              required
              autocomplete="organization"
      >

      <label for="email">
        Email
      </label>

      <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="new-password"
      >

      <label for="password-confirm">
        Confirm password
      </label>

      <input
              id="password-confirm"
              name="confirm"
              type="password"
              required
              autocomplete="new-password"
      >

      <button type="submit" class="button primary">
        Create organization
      </button>

    </form>

    <p class="login-link">
      Already have access?
      <a href="/login">Log in</a>
    </p>

  </div>
</main>

{% endblock %}

{% block scripts %}
<script src="/assets/signup/script.js"></script>
{% endblock %}
