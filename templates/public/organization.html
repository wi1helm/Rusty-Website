{% extends "base.html" %}

{% block title %}Welcome{% endblock %}
    <!-- TODO: This page was using "Login" as its title, which is incorrect for the welcome/landing page. The browser tab will show the wrong page name, confusing users and hurting SEO. Changed to "Welcome" to match the page content. -->

{% block styles %}
<link rel="stylesheet" href="/assets/css/organization.css">
{% endblock %}

{% block content %}
<main class="welcome">
    <h1>Welcome</h1>

    <p>
        Create and manage your organization in one place.
    </p>

    <div class="actions">
        <a href="/create" class="button primary">Create</a>
        <a href="/login" class="button secondary">Log in</a>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="/assets/js/organization.js"></script>
{% endblock %}
