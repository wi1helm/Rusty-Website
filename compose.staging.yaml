services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SQLX_OFFLINE: ${SQLX_OFFLINE:-true}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:?Set a unique RATE_LIMIT_HMAC_KEY secret}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ARGON2_MAX_CONCURRENCY: ${ARGON2_MAX_CONCURRENCY:-4}

      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-10}
      LOGIN_IP_WINDOW_SECONDS: ${LOGIN_IP_WINDOW_SECONDS:-60}
      LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-5}
      LOGIN_ACCOUNT_WINDOW_SECONDS: ${LOGIN_ACCOUNT_WINDOW_SECONDS:-300}
      LOGIN_IP_ACCOUNT_LIMIT: ${LOGIN_IP_ACCOUNT_LIMIT:-5}
      LOGIN_IP_ACCOUNT_WINDOW_SECONDS: ${LOGIN_IP_ACCOUNT_WINDOW_SECONDS:-300}
      SIGNUP_IP_LIMIT: ${SIGNUP_IP_LIMIT:-5}
      SIGNUP_IP_WINDOW_SECONDS: ${SIGNUP_IP_WINDOW_SECONDS:-3600}
      SIGNUP_EMAIL_LIMIT: ${SIGNUP_EMAIL_LIMIT:-3}
      SIGNUP_EMAIL_WINDOW_SECONDS: ${SIGNUP_EMAIL_WINDOW_SECONDS:-3600}
      SIGNUP_DAILY_IP_LIMIT: ${SIGNUP_DAILY_IP_LIMIT:-20}
      SIGNUP_DAILY_IP_WINDOW_SECONDS: ${SIGNUP_DAILY_IP_WINDOW_SECONDS:-86400}

      DATABASE_URL: ${DATABASE_URL}
      CACHE_URL: ${CACHE_URL}

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config: